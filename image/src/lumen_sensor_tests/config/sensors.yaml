# Topics intentionally empty: discover real topics and supply launch arguments.
# Thresholds and exclusion box are examples, not verified robot calibration.
/**:
  ros__parameters:
    stale_timeout_sec: 1.0
    future_tolerance_sec: 0.1
    expected_rate_hz: 0.0  # 0 disables expected-rate comparison
    report_rate_hz: 1.0
    qos_reliability: best_effort
lidar_diagnostic:
  ros__parameters:
    base_frame: base_link
    min_range: 0.3
    max_range: 10.0
    min_height: -0.1
    max_height: 1.0
    enable_self_filter: true
    exclusion_box: [-0.35, 0.35, -0.2, 0.2, -0.5, 0.3]
imu_diagnostic:
  ros__parameters:
    stationary_check: false
    stationary_gyro_tolerance: 0.1
    gravity_m_s2: 9.80665
    gravity_tolerance: 1.5
